services:
  # Servicio 1: Base de datos PostgreSQL
  firmeza-db:
    image: postgres:17-alpine
    container_name: firmeza-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el entorno}
      POSTGRES_DB: FirmezaDB
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d FirmezaDB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Servicio 2: Aplicación web
  firmeza-web:
    build:
      context: ./Firmeza.Web
      dockerfile: Dockerfile
    container_name: firmeza-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      firmeza-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      EPPlus__License: ${EPPLUS_LICENSE:-}
      ConnectionStrings__DefaultConnection: Host=firmeza-db;Port=5432;Database=FirmezaDB;Username=postgres;Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el entorno}
    volumes:
      - recibos:/app/wwwroot/recibos

volumes:
  pgdata:
  recibos:

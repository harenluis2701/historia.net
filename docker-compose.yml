services:
  tests:
    build:
      context: .
      dockerfile: Firmeza.Tests/Dockerfile
    container_name: firmeza-tests
    restart: "no"

  db:
    image: postgres:17-alpine
    container_name: firmeza-db
    restart: unless-stopped
    depends_on:
      tests:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: FirmezaHaren
      POSTGRES_DB: FirmezaDB
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d FirmezaDB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Firmeza.Api/Dockerfile
    container_name: firmeza-api
    restart: unless-stopped
    depends_on:
      tests:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=FirmezaDB;Username=postgres;Password=FirmezaHaren
      Jwt__Key: ${JWT_KEY:-FirmezaSilvaFirmezaSilvaFirmezaSilva}
      Cors__AllowedOrigins__0: ${BLAZOR_ORIGIN:-http://localhost:5173}
      Email__Host: smtp.gmail.com
      Email__Port: 587
      Email__User: ${SMTP_USER:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Email__FromName: Firmeza
      Email__EnableSsl: "true"
      BootstrapAdmin__Email: ${ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${ADMIN_PASSWORD:-}

  admin:
    build:
      context: ./Firmeza.Web
      dockerfile: Dockerfile
    container_name: firmeza-web
    restart: unless-stopped
    depends_on:
      tests:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      EPPlus__License: ${EPPLUS_LICENSE:-}
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=FirmezaDB;Username=postgres;Password=FirmezaHaren
    volumes:
      - recibos:/app/wwwroot/recibos

  client:
    build:
      context: ./Firmeza.Portal
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${PORTAL_API_URL:-http://localhost:8081/api}
    container_name: firmeza-portal
    restart: unless-stopped
    depends_on:
      tests:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "5173:80"

volumes:
  pgdata:
  recibos:
